name: CraftEngine Proxy Compatibility

on:
  push:
    branches: [chore/minecraft-26.3, main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: craft-engine-proxy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Velocity and BungeeCord proxy jars
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21 (Gradle launcher and bytecode floor)
        id: java21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up JDK 25 (toolchain)
        id: java25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        env:
          JAVA_HOME_21: ${{ steps.java21.outputs.path }}
          JAVA_HOME_25: ${{ steps.java25.outputs.path }}
        run: |
          export JAVA_HOME="$JAVA_HOME_21"
          export PATH="$JAVA_HOME/bin:$PATH"
          ./gradlew -Dorg.gradle.java.installations.paths="$JAVA_HOME_25" --no-daemon --stacktrace clean build

      - name: Smoke-check supported protocol classes
        run: |
          test -f target/craft-engine-proxy-velocity-plugin-26.9.jar
          test -f target/craft-engine-proxy-bungeecord-plugin-26.9.jar
          for jar in target/*.jar; do
            jar tf "$jar" | grep -q 'ClientboundPacketType_1_19_4.class'
            jar tf "$jar" | grep -q 'ClientboundPacketType_26_3.class'
          done

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: craft-engine-proxy-jars
          path: |
            target/*.jar
